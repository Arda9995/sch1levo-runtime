name: build-runtime

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: "Runtime version (also the install folder name on the tablet)"
        required: true
        default: "r2-wine11.0-box64-0.4.4"
      publish:
        description: "Publish a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  BOX64_TAG: v0.4.4
  WINE_VERSION: "11.0"
  WINE_URL: https://dl.winehq.org/wine/source/11.0/wine-11.0.tar.xz
  WINE_SHA256: c07a6857933c1fc60dff5448d79f39c92481c1e9db5aa628db9d0358446e0701
  APP_FILES: /data/data/app.sch1levo/files/sch1levo

jobs:
  box64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build Box64 (generic ARM64, glibc), linked for the app's install folder
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build
          git clone --depth 1 --branch "$BOX64_TAG" https://github.com/ptitSeb/box64 src-box64
          # The interpreter and library path are set by the linker, not patched in afterwards: r1 used patchelf,
          # which made two LOAD segments overlap so .dynamic landed on a read-only page and box64 crashed at start.
          # DT_RPATH (--disable-new-dtags) also covers libraries glibc dlopens itself, such as libgcc_s for
          # pthread_exit. A response file keeps $ORIGIN away from shell and ninja expansion.
          INTERP="$APP_FILES/runtime/${{ inputs.runtime_version }}/bin/ld-linux-aarch64.so.1"
          printf '%s\n' "-Wl,--dynamic-linker=$INTERP" '-Wl,-rpath,$ORIGIN/../glibc/lib' '-Wl,--disable-new-dtags' > box64-link.rsp
          cmake -S src-box64 -B build -G Ninja -D ARM_DYNAREC=ON -D BAD_SIGNAL=ON -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_EXE_LINKER_FLAGS="@$PWD/box64-link.rsp"
          ninja -C build box64
      - name: Check the box64 ELF layout
        run: python3 scripts/check-elf.py build/box64 "$APP_FILES/runtime/${{ inputs.runtime_version }}/bin/ld-linux-aarch64.so.1" '$ORIGIN/../glibc/lib'
      - name: Collect box64 + glibc
        run: |
          OUT=box64-out; mkdir -p $OUT/lib $OUT/x64lib
          cp build/box64 $OUT/box64
          strip --strip-debug $OUT/box64
          python3 scripts/check-elf.py $OUT/box64 "$APP_FILES/runtime/${{ inputs.runtime_version }}/bin/ld-linux-aarch64.so.1" '$ORIGIN/../glibc/lib'
          for l in ld-linux-aarch64.so.1 libc.so.6 libm.so.6 libdl.so.2 libpthread.so.0 librt.so.1 \
                   libresolv.so.2 libutil.so.1 libgcc_s.so.1 libstdc++.so.6; do
            cp -L "/lib/aarch64-linux-gnu/$l" $OUT/lib/ || cp -L "/usr/lib/aarch64-linux-gnu/$l" $OUT/lib/
          done
          [ -d src-box64/x64lib ] && cp -RL src-box64/x64lib/. $OUT/x64lib/ || true
          cp src-box64/LICENSE $OUT/LICENSE
          dpkg -s libc6 | grep -E '^(Package|Version|Source)' > $OUT/GLIBC-SOURCE.txt
          echo "glibc source: apt-get source glibc=$(dpkg-query -W -f='${Version}' libc6) (Ubuntu 24.04 arm64)" >> $OUT/GLIBC-SOURCE.txt
          { echo "box64 $BOX64_TAG $(git -C src-box64 rev-parse HEAD)"; echo "wine $WINE_VERSION"; } > $OUT/VERSIONS.txt
      - uses: actions/upload-artifact@v4
        with: { name: box64, path: box64-out }

  wine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc g++ flex bison make gcc-mingw-w64 g++-mingw-w64 xz-utils
      - name: Fetch and verify Wine source
        run: |
          curl -fsSL -o wine.tar.xz "$WINE_URL"
          echo "$WINE_SHA256  wine.tar.xz" | sha256sum -c -
          tar -xJf wine.tar.xz
          ./patches/apply-wine-patches.sh "wine-$WINE_VERSION"
      - name: Configure (x86-64 Linux, WoW64 PE, headless for round 1)
        run: |
          mkdir build && cd build
          CFLAGS="-O2 -DSCH1LEVO_NO_TMP" ../wine-$WINE_VERSION/configure --prefix=/wine \
            --enable-archs=i386,x86_64 --disable-tests \
            --without-x --without-wayland --without-freetype --without-gstreamer --without-alsa --without-pulse \
            --without-oss --without-dbus --without-cups --without-sane --without-krb5 --without-gphoto \
            --without-v4l2 --without-pcap --without-usb --without-netapi --without-opencl --without-udev \
            --without-unwind --without-ffmpeg --without-capi --without-pcsclite --without-gssapi --without-sdl
      - name: Build
        run: make -C build -j"$(nproc)"
      - name: Install
        run: |
          make -C build install DESTDIR="$PWD/wine-out" >/dev/null
          cp wine-$WINE_VERSION/COPYING.LIB wine-out/COPYING.LIB
          du -sh wine-out/wine
      - name: Build Windows test programs and the Steam wrapper
        run: |
          mkdir -p pe-out
          x86_64-w64-mingw32-gcc -O2 -s -o pe-out/hello.exe src/hello.c
          x86_64-w64-mingw32-gcc -O2 -s -o pe-out/d3d11probe.exe src/d3d11probe.c -ld3d11 -ldxgi -luuid
          x86_64-w64-mingw32-gcc -O2 -s -municode -mwindows -o pe-out/steamwebhelper.exe src/steamwebhelper_wrapper.c
      - uses: actions/upload-artifact@v4
        with: { name: wine, path: wine-out }
      - uses: actions/upload-artifact@v4
        with: { name: pe, path: pe-out }

  package:
    needs: [box64, wine]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Package runtime zip
        run: |
          chmod +x art/box64/box64
          ./scripts/package.sh "${{ inputs.runtime_version }}" art/box64 art/wine art/pe dist
      - uses: actions/upload-artifact@v4
        with: { name: runtime, path: dist }

  # Installs the zip exactly where the app puts it and runs the app's Windows-environment step on ARM64.
  # Nothing is published unless this passes.
  test:
    needs: [package]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: runtime, path: dist }
      - name: Install like the app does
        run: |
          RT="$APP_FILES/runtime/${{ inputs.runtime_version }}"
          sudo mkdir -p "$RT" && sudo chown -R "$(id -u):$(id -g)" /data
          unzip -q dist/*.zip -d "$RT"
          # The app's unzip keeps no permissions; it marks every file under a bin/ folder executable.
          find "$RT" -type f -path '*/bin/*' -exec chmod u+x {} +
          [ -e /system/bin/sh ] || { sudo mkdir -p /system/bin && sudo ln -s /bin/sh /system/bin/sh; }
          echo "RT=$RT" >> "$GITHUB_ENV"
      - name: version
        run: SCH1LEVO_DATA=/data/t SCH1LEVO_PREFIX=/data/t/prefix "$RT/bin/sch1levo-runtime" version
      - name: prefix-init
        run: |
          SCH1LEVO_BOX64_LOG=0 SCH1LEVO_DATA=/data/t SCH1LEVO_PREFIX=/data/t/prefix \
            timeout 1200 "$RT/bin/sch1levo-runtime" prefix-init 2>&1 | tee prefix.log
          grep -q '^PREFIX_OK' prefix.log
          grep -q 'HELLO_OK' prefix.log
          ! grep -q 'libgcc_s.so.1 must be installed' prefix.log
      - name: Publish release
        if: ${{ inputs.publish }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="runtime-${{ inputs.runtime_version }}"
          gh release create "$TAG" dist/*.zip dist/*.sha256 dist/manifest-snippet.properties \
            --title "sch1levo runtime ${{ inputs.runtime_version }}" \
            --notes "Built by workflow run ${{ github.run_id }} from ${{ github.sha }}. Box64 + Wine without a display bridge (version, prefix-init only). Passed prefix-init on ARM64 at the app's install path."
